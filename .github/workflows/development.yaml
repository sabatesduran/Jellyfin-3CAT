name: 3Cat 2.0 development
on:
  push:
    branches: [develop/threecat-2]
  pull_request:
    branches: [feature/dynamic-catalogue]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net9.0
            sdk: 9.0.x
            jellyfin: 10.11.6
            prefix: '10.11'
          - framework: net10.0
            sdk: 10.0.x
            jellyfin: 12.2.0
            prefix: '12.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-*.mjs
      - run: dotnet test -c Release -p:ThreeCatTargetFramework=${{ matrix.framework }} -p:ThreeCatJellyfinVersion=${{ matrix.jellyfin }}
      - shell: pwsh
        run: ./package.ps1 -TargetFramework ${{ matrix.framework }} -JellyfinVersion ${{ matrix.jellyfin }}
      - name: Runtime smoke (isolated container)
        env:
          JELLYFIN_IMAGE: jellyfin/jellyfin:${{ matrix.jellyfin }}
          EXPECTED_SERVER_PREFIX: ${{ matrix.prefix }}
        run: bash scripts/smoke-jellyfin-12.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-${{ matrix.framework }}
          path: |
            dist/*.zip
            threecat-smoke.log
          if-no-files-found: warn
