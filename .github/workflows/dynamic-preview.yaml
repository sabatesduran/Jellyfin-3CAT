name: Publish dynamic catalogue preview
on:
  push:
    branches: [feature/dynamic-catalogue]
    paths: ['.github/workflows/dynamic-preview.yaml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynamic-preview
  cancel-in-progress: false
jobs:
  publish-preview:
    if: github.repository == 'sabatesduran/Jellyfin-3CAT' && github.ref == 'refs/heads/feature/dynamic-catalogue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify
        run: dotnet test --configuration Release --nologo
      - name: Package
        shell: pwsh
        run: ./package.ps1 -Configuration Release -Version 1.13.0.0
      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dynamic-preview-1.13.0.0
          target_commitish: ${{ github.sha }}
          name: 3Cat a la carta 1.13.0.0 (experimental)
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/threecat_1.13.0.0.zip
          body: Experimental Jellyfin 10.11 build. Compilation and automated tests passed; runtime validation is pending. Back up configuration before testing.
      - name: Generate preview manifest from the published ZIP
        run: |
          python3 - <<'PY'
          import hashlib, json, datetime, pathlib
          package = pathlib.Path('dist/threecat_1.13.0.0.zip')
          plugin = json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))[0]
          plugin['versions'] = [{
              'version': '1.13.0.0',
              'changelog': 'Experimental native 3Cat catalogue. Runtime validation pending.',
              'targetAbi': '10.11.0.0',
              'sourceUrl': 'https://github.com/sabatesduran/Jellyfin-3CAT/releases/download/dynamic-preview-1.13.0.0/threecat_1.13.0.0.zip',
              'checksum': hashlib.md5(package.read_bytes()).hexdigest().upper(),
              'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }]
          pathlib.Path('manifest-preview.json').write_text(json.dumps([plugin], ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest-preview.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified build to preview catalogue'
            git push origin HEAD:feature/dynamic-catalogue
          fi
