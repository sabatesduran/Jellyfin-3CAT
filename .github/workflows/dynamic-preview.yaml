name: Publish dynamic catalogue preview
on:
  push:
    branches: [feature/dynamic-catalogue]
    paths: ['.github/workflows/dynamic-preview.yaml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dynamic-preview
  cancel-in-progress: false
jobs:
  compatibility-12:
    if: github.repository == 'sabatesduran/Jellyfin-3CAT' && github.ref == 'refs/heads/feature/dynamic-catalogue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and test against Jellyfin 12.2
        run: dotnet test Jellyfin.Plugin.ThreeCat.Tests/Jellyfin.Plugin.ThreeCat.Tests.csproj --configuration Release --nologo -p:ThreeCatTargetFramework=net10.0 -p:ThreeCatJellyfinVersion=12.2.0
  publish-preview:
    if: github.repository == 'sabatesduran/Jellyfin-3CAT' && github.ref == 'refs/heads/feature/dynamic-catalogue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify settings behavior
        run: node --test scripts/test-settings.mjs scripts/test-browse.mjs
      - name: Verify
        run: dotnet test --configuration Release --nologo
      - name: Package
        shell: pwsh
        run: ./package.ps1 -Configuration Release -Version 1.14.0.1
      - name: Publish preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dynamic-preview-1.14.0.1
          target_commitish: ${{ github.sha }}
          name: 3Cat a la carta 1.14.0.1 (experimental)
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/threecat_1.14.0.1.zip
            dist/3cat.png
          body: Experimental expanded 3Cat catalogue. Compilation and automated tests passed; runtime validation is pending. Back up configuration before testing.
      - name: Generate preview manifest from the published ZIP
        run: |
          python3 - <<'PY'
          import hashlib, json, datetime, pathlib
          package = pathlib.Path('dist/threecat_1.14.0.1.zip')
          plugin = json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))[0]
          plugin['imageUrl'] = 'https://github.com/sabatesduran/Jellyfin-3CAT/releases/download/dynamic-preview-1.14.0.1/3cat.png'
          plugin['versions'] = [{
              'version': '1.14.0.1',
              'changelog': 'Dedicated web catalogue and plugin artwork. Runtime validation pending.',
              'targetAbi': '10.11.0.0',
              'sourceUrl': 'https://github.com/sabatesduran/Jellyfin-3CAT/releases/download/dynamic-preview-1.14.0.1/threecat_1.14.0.1.zip',
              'checksum': hashlib.md5(package.read_bytes()).hexdigest().upper(),
              'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }]
          pathlib.Path('manifest-preview.json').write_text(json.dumps([plugin], ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest-preview.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified build to preview catalogue'
            git pull --rebase origin feature/dynamic-catalogue
            git push origin HEAD:feature/dynamic-catalogue
          fi
